<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DataLens — Журнал відвідуваності</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #F0F2F5; color: #222; }

  /* Header */
  .header {
    background: #1A3A6B; color: white; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .header h1 { font-size: 17px; font-weight: 700; }
  .sync-btn {
    background: #2980B9; color: white; border: none; border-radius: 8px;
    padding: 7px 13px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .sync-btn:active { background: #1a6a9a; }

  /* Status bar */
  .status-bar {
    background: #e8f0fe; color: #1A3A6B; padding: 7px 16px;
    font-size: 12px; text-align: center; border-bottom: 1px solid #c5d5f5;
  }

  /* Controls */
  .controls { padding: 12px 14px; background: white; border-bottom: 1px solid #ddd; }
  .control-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .control-row:last-child { margin-bottom: 0; }
  label { font-size: 13px; font-weight: 600; color: #1A3A6B; min-width: 48px; }
  select, input[type="date"] {
    flex: 1; padding: 8px 10px; border: 1.5px solid #c5d5f5; border-radius: 8px;
    font-size: 14px; background: #f8faff; color: #222; outline: none;
  }
  select:focus, input:focus { border-color: #2980B9; }

  /* Info bar */
  .info-bar {
    padding: 8px 14px; font-size: 12px; color: #555; background: #f8f9fa;
    border-bottom: 1px solid #eee; min-height: 32px;
  }

  /* Student list */
  .student-list { padding: 8px 14px 80px; }
  .student-card {
    background: white; border-radius: 12px; margin-bottom: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden;
  }
  .student-card:nth-child(even) { background: #EAF0FB; }
  .student-info {
    padding: 11px 14px 6px;
    display: flex; align-items: center; gap: 10px;
  }
  .student-num {
    font-size: 12px; color: #888; min-width: 22px; font-weight: 600;
  }
  .student-name { font-size: 15px; font-weight: 500; flex: 1; }
  .student-status {
    font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  }
  .status-present { background: #d4edda; color: #1E8449; }
  .status-absent  { background: #fde8e8; color: #C0392B; }
  .status-none    { background: #f0f0f0; color: #888; }

  .mark-buttons {
    display: flex; gap: 6px; padding: 6px 14px 11px;
  }
  .mark-btn {
    flex: 1; padding: 9px 4px; border: none; border-radius: 9px;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
  }
  .mark-btn:active { opacity: 0.75; }
  .btn-present { background: #1E8449; color: white; }
  .btn-absent  { background: #C0392B; color: white; }
  .btn-clear   { background: #7F8C8D; color: white; }

  /* Bottom summary */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #1A3A6B; color: white; padding: 10px 16px;
    display: flex; justify-content: space-around; font-size: 13px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
  }
  .bottom-stat { text-align: center; }
  .bottom-stat span { display: block; font-size: 20px; font-weight: 700; }

  /* Loading / empty */
  .loading { text-align: center; padding: 40px 20px; color: #888; font-size: 15px; }

  /* Toast */
  .toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: #1A3A6B; color: white; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; font-weight: 600; z-index: 999;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>📋 DataLens</h1>
  <button class="sync-btn" onclick="syncAll()">☁ Оновити</button>
</div>

<div class="status-bar" id="statusBar">Завантаження даних...</div>

<div class="controls">
  <div class="control-row">
    <label>День</label>
    <select id="daySelect" onchange="onDayChange()">
      <option value="monday">Понеділок</option>
      <option value="tuesday">Вівторок</option>
      <option value="wednesday">Середа</option>
      <option value="thursday">Четверг</option>
      <option value="friday">П'ятниця</option>
    </select>
  </div>
  <div class="control-row">
    <label>Пара</label>
    <select id="lessonSelect" onchange="onLessonChange()"></select>
  </div>
  <div class="control-row">
    <label>Дата</label>
    <input type="date" id="dateInput" onchange="onDateChange()">
  </div>
</div>

<div class="info-bar" id="infoBar">Оберіть день та пару</div>

<div class="student-list" id="studentList">
  <div class="loading">⏳ Завантаження...</div>
</div>

<div class="bottom-bar">
  <div class="bottom-stat">
    <span id="countPresent">—</span>присутні
  </div>
  <div class="bottom-stat">
    <span id="countAbsent">—</span>відсутні
  </div>
  <div class="bottom-stat">
    <span id="countTotal">—</span>всього
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FIREBASE_URL = "https://datalens-11604-default-rtdb.firebaseio.com";
const DAYS_UK = { monday:"Понеділок", tuesday:"Вівторок", wednesday:"Середа", thursday:"Четверг", friday:"П'ятниця" };

let appCfg  = null;
let appData = {};
let marksCache = {};

// ── Firebase helpers ──────────────────────────────────────

async function fbGet(path) {
  try {
    const r = await fetch(`${FIREBASE_URL}/${path}.json`);
    return await r.json();
  } catch(e) { return null; }
}

async function fbSet(path, data) {
  try {
    await fetch(`${FIREBASE_URL}/${path}.json`, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });
  } catch(e) {}
}

// ── Ініціалізація ─────────────────────────────────────────

async function syncAll() {
  setStatus("☁ Оновлення з хмари...");
  try {
    const [cfg, data] = await Promise.all([fbGet("config"), fbGet("attendance")]);
    if (cfg)  { appCfg  = cfg;  }
    if (data) { appData = data; }
    if (!appCfg || !appCfg.students || appCfg.students.length === 0) {
      setStatus("⚠ Немає даних. Запустіть DataLens на ПК — він автоматично надішле дані.");
      document.getElementById("studentList").innerHTML =
        '<div class="loading">📋 Дані відсутні.<br><br>1. Відкрийте DataLens на ПК<br>2. Зачекайте 5 секунд<br>3. Натисніть ☁ Оновити тут</div>';
      return;
    }
    setStatus(`✅ Група: ${appCfg.group || ""} | Синхронізовано`);
    refreshLessonSelector();
    loadMarks();
  } catch(e) {
    setStatus("❌ Помилка мережі: " + e.message);
  }
}

// ── Дата ──────────────────────────────────────────────────

function todayStr() {
  return new Date().toISOString().split("T")[0];
}

function getMonday(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d.toISOString().split("T")[0];
}

function slotKey() {
  const day   = document.getElementById("daySelect").value;
  const li    = document.getElementById("lessonSelect").selectedIndex;
  const date  = document.getElementById("dateInput").value;
  const mon   = getMonday(date);
  return `${mon}|${day}|${li}`;
}

// ── Селектори ─────────────────────────────────────────────

function refreshLessonSelector() {
  if (!appCfg) return;
  const day = document.getElementById("daySelect").value;
  const lessons = (appCfg.schedule || {})[day] || ["","","","",""];
  const sel = document.getElementById("lessonSelect");
  sel.innerHTML = "";
  lessons.forEach((ln, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = ln ? `Пара ${i+1}: ${ln}` : `Пара ${i+1} (порожня)`;
    sel.appendChild(opt);
  });
  updateInfoBar();
}

function updateInfoBar() {
  if (!appCfg) return;
  const day = document.getElementById("daySelect").value;
  const li  = document.getElementById("lessonSelect").selectedIndex;
  const lessons = (appCfg.schedule || {})[day] || [];
  const ln = lessons[li] || "";
  const bar = document.getElementById("infoBar");
  if (ln) {
    bar.textContent = `Відмічаємо: ${DAYS_UK[day]} — ${ln}`;
    bar.style.color = "#1A3A6B";
  } else {
    bar.textContent = `⚠ Для цієї пари немає предмету в розкладі`;
    bar.style.color = "#C0392B";
  }
}

function onDayChange()   { refreshLessonSelector(); loadMarks(); }
function onLessonChange(){ updateInfoBar(); loadMarks(); }
function onDateChange()  { loadMarks(); }

// ── Відмітки ──────────────────────────────────────────────

function loadMarks() {
  const sk = slotKey();
  marksCache = Object.assign({}, (appData[sk] || {}));
  renderStudents();
}

function renderStudents() {
  if (!appCfg || !appCfg.students) {
    document.getElementById("studentList").innerHTML =
      '<div class="loading">Немає даних студентів</div>';
    return;
  }
  const list = document.getElementById("studentList");
  list.innerHTML = "";
  let present = 0, absent = 0;

  appCfg.students.forEach((name, idx) => {
    const mark = marksCache[name] || "";
    if (mark === "•") present++;
    if (mark === "Н") absent++;

    const statusText  = mark === "•" ? "● Присутній" : mark === "Н" ? "Н Відсутній" : "— Не відмічено";
    const statusClass = mark === "•" ? "status-present" : mark === "Н" ? "status-absent" : "status-none";

    const card = document.createElement("div");
    card.className = "student-card";
    card.innerHTML = `
      <div class="student-info">
        <span class="student-num">${idx+1}</span>
        <span class="student-name">${name}</span>
        <span class="student-status ${statusClass}" id="st_${idx}">${statusText}</span>
      </div>
      <div class="mark-buttons">
        <button class="mark-btn btn-present" onclick="markStudent('${name.replace(/'/g,"\\'")}','•',${idx})">● Є</button>
        <button class="mark-btn btn-absent"  onclick="markStudent('${name.replace(/'/g,"\\'")}','Н',${idx})">Н Нема</button>
        <button class="mark-btn btn-clear"   onclick="markStudent('${name.replace(/'/g,"\\'")}','',${idx})">— Скинути</button>
      </div>`;
    list.appendChild(card);
  });

  document.getElementById("countPresent").textContent = present;
  document.getElementById("countAbsent").textContent  = absent;
  document.getElementById("countTotal").textContent   = appCfg.students.length;
}

async function markStudent(name, value, idx) {
  const day = document.getElementById("daySelect").value;
  const li  = document.getElementById("lessonSelect").selectedIndex;
  const lessons = (appCfg.schedule || {})[day] || [];
  const ln = lessons[li] || "";
  if (!ln) { showToast("⚠ Немає предмету для цієї пари!"); return; }

  if (value === "") {
    delete marksCache[name];
  } else {
    marksCache[name] = value;
  }

  // Зберігаємо у Firebase
  const sk = slotKey();
  appData[sk] = Object.assign({}, marksCache);
  await fbSet("attendance", appData);

  renderStudents();
  showToast(value === "•" ? "✅ Присутній" : value === "Н" ? "❌ Відсутній" : "🔄 Скинуто");
}

// ── Toast ─────────────────────────────────────────────────

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function setStatus(msg) {
  document.getElementById("statusBar").textContent = msg;
}

// ── Старт ─────────────────────────────────────────────────

window.onload = () => {
  // Встановлюємо сьогоднішню дату
  document.getElementById("dateInput").value = todayStr();
  // Встановлюємо поточний день тижня
  const days = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const today = days[new Date().getDay()];
  const daySelect = document.getElementById("daySelect");
  const validDay = ["monday","tuesday","wednesday","thursday","friday"].includes(today) ? today : "monday";
  daySelect.value = validDay;
  // Завантажуємо дані
  syncAll();
};
</script>
</body>
</html>
